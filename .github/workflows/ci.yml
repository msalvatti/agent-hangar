# Continuous integration: every gate the project defines, on pull requests and on pushes to main.
# No job is allowed to fail softly: a red job blocks the merge.
# pnpm comes from `packageManager` in package.json via pnpm/action-setup (on the organisation's
# allow-list of third-party actions); Node 24 via actions/setup-node.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096
  # Local compose Postgres credentials (not a secret: loopback-only service in CI and on laptops).
  COMPOSE_DB_CREDENTIALS: 'ah:ah'

# Every job below declares `timeout-minutes`. Without one a hung job holds a runner for the
# platform default of six hours, so a deadlocked test or a stalled download costs a working day
# instead of failing fast.
#
# The values are ceilings for a hang, not budgets. Each is derived from the slowest completed run
# of that job over the last forty runs of this workflow — lint 2:00, typecheck 1:16, unit 8:18,
# integration 2:45, e2e 3:21, build 2:39, secret-scan 0:33 — and then rounded well above it, so a
# runner having a bad day still finishes. `e2e` keeps the same headroom as `integration` although
# it is short today: no specs are committed yet, so it currently skips the browser install and the
# suite itself, and both arrive the moment the first spec lands. Raise a value when the job
# legitimately grows; never trim one back to the last measurement.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm format:check
      # ESLint reports neither a directive that actually suppresses a rule, nor a coverage-ignore
      # comment, nor anything in a shell file, so the ban is only real if this runs over every
      # tracked source and shell file.
      - name: suppression ban
        run: bash scripts/check-suppressions.sh

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      # `declaration-specifiers-dist.test.ts` scans the emitted declaration graph of
      # @agent-hangar/core and skips when `packages/core/dist` is absent, so this job builds that
      # package: without it the scan reports a skip, which reads like a pass while checking
      # nothing. The build also runs `assertFullyRewritten`, so a declaration left unrewritten
      # fails this job twice over.
      - run: pnpm --filter @agent-hangar/core build
      - run: pnpm test -- --coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            packages/*/coverage/coverage-summary.json
            apps/*/coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ah
          POSTGRES_PASSWORD: ah
          # Named for the instance below: the test helpers refuse to truncate a database that is
          # not called agent_hangar_<instance> with "test" as a word of the instance.
          POSTGRES_DB: agent_hangar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ah -d agent_hangar_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:8-alpine
        # Published on the port instance "test" derives (AH_PORT_BASE 3000 + 2), not on 6379. The
        # integration harness empties Redis, and it refuses any target that is not this instance's
        # own — a rule that exists because REDIS_URL is independent of DATABASE_URL, so a shared
        # Redis named alongside a conventionally named test database would otherwise pass every
        # check and then be flushed. Postgres needs no equivalent: its truncation guard keys on the
        # database *name* (agent_hangar_test), which no port change affects.
        ports:
          - 3002:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      AH_INSTANCE: test
      REDIS_URL: redis://127.0.0.1:3002
      DOCKER_AVAILABLE: '1'
      # These suites truncate every table; the helpers refuse to run without this opt-in.
      AH_ALLOW_DESTRUCTIVE_TESTS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Derive DATABASE_URL
        run: echo "DATABASE_URL=postgresql://${COMPOSE_DB_CREDENTIALS}@127.0.0.1:5432/agent_hangar_test" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agent-hangar/core db:generate
      - run: pnpm --filter @agent-hangar/core db:migrate
      # `pnpm infra:image` also stages the agent-runtime bundle into the build context, which a
      # bare `docker build` would leave out — the image would then have no runtime to exec.
      - run: pnpm infra:image
      - run: pnpm test:integration

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ah
          POSTGRES_PASSWORD: ah
          # Named for the instance below: the test helpers refuse to truncate a database that is
          # not called agent_hangar_<instance> with "test" as a word of the instance.
          POSTGRES_DB: agent_hangar_test
        # Published on the port the instance derives (AH_PORT_BASE + 1), not on 5432: the
        # destructive helpers check the port the instance derives, so a service on the standard
        # port is refused — correctly, since a shared server would otherwise be truncated.
        ports:
          - 3901:5432
        options: >-
          --health-cmd "pg_isready -U ah -d agent_hangar_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:8-alpine
        # AH_PORT_BASE + 2, for the same reason as Postgres above.
        ports:
          - 3902:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      AH_INSTANCE: test
      # Ports of this instance's block: web 3900, Postgres 3901, Redis 3902, git server 3907,
      # GitHub stub 3908. The services above are published to match.
      AH_PORT_BASE: '3900'
      E2E_INSTANCE: test
      E2E_PORT_BASE: '3900'
      # Mock mode runs the whole interface path against the in-browser mock API, and skips the
      # assertions that need a worker, Docker and the local git server. Set this to `real` once
      # the API and the worker are wired end to end; nothing else here has to change.
      E2E_MODE: mock
      E2E_MANAGED_SERVER: '1'
      # Postgres and Redis are provided as services above, so the harness must not start compose.
      E2E_SKIP_COMPOSE: '1'
      # The docker0 gateway: the address a workspace container reaches the runner's host by.
      E2E_GITSERVER_HOST: 172.17.0.1
      REDIS_URL: redis://127.0.0.1:3902
      AGENT_MODEL_PROVIDER: fake
      # These suites truncate every table; the helpers refuse to run without this opt-in.
      AH_ALLOW_DESTRUCTIVE_TESTS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Derive DATABASE_URL
        run: echo "DATABASE_URL=postgresql://${COMPOSE_DB_CREDENTIALS}@127.0.0.1:3901/agent_hangar_test" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      # Keyed on the INSTALLED Playwright version, read after the install: hashing the manifest
      # would hash the caret range instead, so a lockfile-only upgrade would keep the same key,
      # hit the cache, skip the install, and leave Playwright looking for a browser revision that
      # was never downloaded. An unrelated dependency bump still leaves the browsers alone.
      - name: Resolve the installed Playwright version
        id: playwright-version
        run: |
          version="$(pnpm --filter web exec playwright --version | tr -d '\r' | awk '{print $NF}')"
          if [ -z "$version" ]; then
            echo 'Could not read the installed Playwright version' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      # `--with-deps` is deliberately absent: it runs apt-get on a fresh runner every time, which
      # measurements showed dominating this job (over two minutes on the mirror alone, and one run
      # at twenty-three), and OS packages cannot be cached. The ubuntu-latest image already ships
      # the libraries Chromium needs. If a future run fails to launch the browser, the fix is the
      # official Playwright container image for this job, not restoring the apt install.
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install chromium
      # Built here rather than by the suite so a real-mode run finds it already present; in mock
      # mode nothing starts a workspace, but building it keeps the switch above to one line.
      # `pnpm infra:image` also stages the agent-runtime bundle into the build context, which a
      # bare `docker build` would leave out — the image would then have no runtime to exec.
      - run: pnpm infra:image
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm build
      # `pnpm infra:image` also stages the agent-runtime bundle into the build context, which a
      # bare `docker build` would leave out — the image would then have no runtime to exec.
      - run: pnpm infra:image
      # `--no-experimental-detect-module` disables Node's module-syntax heuristic, so this only
      # succeeds because /opt/agent-runtime/package.json declares `"type": "module"` — proving the
      # manifest was actually copied and is effective, not merely that cli.js happens to run.
      - run: docker run --rm agent-hangar/workspace:dev node --no-experimental-detect-module /opt/agent-runtime/cli.js --version

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # The gitleaks GitHub Action needs an organisation licence key; the official container image
      # does not, so the scan runs through it until a key exists.
      #
      # Neither scan may reach the remote: the checkout above persists no credentials, so any
      # `git fetch` here fails on a private repository. Both modes work from what checkout already
      # placed on disk — the working tree on pull requests, the full local history on pushes.
      # Two scans on a pull request, because neither alone is enough: the tree scan sees a secret
      # that is present now, and the range scan sees one that was committed and deleted again in a
      # later commit of the same branch, which stays in history and which the tree scan cannot see.
      # The base commit is the merge commit's first parent, so `fetch-depth: 0` above already has
      # it and no fetch — hence no credential — is needed.
      - name: gitleaks (working tree)
        if: github.event_name == 'pull_request'
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          dir /repo --config /repo/.gitleaks.toml --redact --no-banner
      - name: gitleaks (commits of this pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --config /repo/.gitleaks.toml --redact --no-banner
          --log-opts="$BASE_SHA..HEAD"
      - name: gitleaks (full history)
        if: github.event_name == 'push'
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --config /repo/.gitleaks.toml --redact --no-banner
